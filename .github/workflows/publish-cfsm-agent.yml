name: Publish CFSM Agent container

on:
  push:
    branches:
      - cfsm-agent-container
    paths:
      - Dockerfile.cfsm-agent
      - .github/workflows/publish-cfsm-agent.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 and arm64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cfsm-agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/zaxlear/cfsm-agent:v1.0.11
            ghcr.io/zaxlear/cfsm-agent:latest
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
